# Local observability stack for TheraViva.
#
#   docker compose up -d
#
# Prometheus scrapes the backend's /metrics (run it on the host at :8000) and
# Grafana provisions a "TheraViva overview" board. Point the frontend at Grafana
# with NEXT_PUBLIC_GRAFANA_URL=http://localhost:3001 and
# NEXT_PUBLIC_GRAFANA_DASHBOARD_UID=theraviva-overview.
#
# Anonymous viewing + embedding are enabled so the admin page can iframe the
# board. Do not expose this stack to the public internet without auth.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: theraviva-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: theraviva-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/theraviva-overview.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
